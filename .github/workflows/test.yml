name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: pre-commit
            command: pre-commit run --all-files
            python-version: "3.10"
          - name: mypy
            command: mypy air_link
            python-version: "3.10"
          - name: pytest on Python 3.10
            command: pytest
            python-version: "3.10"
          - name: pytest on Python 3.14
            command: pytest
            python-version: "3.14"
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Cache pre-commit hook environments
        if: matrix.name == 'pre-commit'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: ${{ matrix.name }}
        run: uv run --locked ${{ matrix.command }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build
        run: uv build
      - name: Check wheel contents
        run: ./.github/scripts/check_wheel_contents.sh
