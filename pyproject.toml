[project]
name = "air-link"
version = "0.5.0"
description = "Provide SSH access, diagnostics and administration for your edge devices."
authors = [{ name = "Zauberzeug GmbH", email = "info@zauberzeug.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "nicegui>=3.15.0,<4",
    "docker>=7.2.0,<8",
    "aioping>=0.4.0,<0.5",
]

[project.scripts]
air-link = "air_link.main:main"

[project.urls]
Repository = "https://github.com/zauberzeug/air-link"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["air_link"]

[tool.ruff]
target-version = "py310"
indent-width = 4
line-length = 120

[tool.ruff.lint]
select = [
    "I",  # isort
    "E",  # pycodestyle
    "W",  # pycodestyle
    "B",  # bugbear
    "F",  # pyflakes
    "UP", # pyupgrade
    "RUF", # ruff
    "PL", # pylint
]
fixable = [
    "I",  # isort
]
ignore = [
    "PLR2004", # magic value comparison
]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["docker"]
ignore_missing_imports = true
