[project]
name = "air-link"
version = "0.6.0"
description = "Provide SSH access, diagnostics and administration for your edge devices."
authors = [{ name = "Zauberzeug GmbH", email = "info@zauberzeug.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "nicegui>=3.15.0,<4",
    "docker>=7.2.0,<8",
    "aioping>=0.4.0,<0.5",
    "typing-extensions>=4.0.0,<5",
    "urllib3>=2.6.3", # https://github.com/zauberzeug/air-link/security/dependabot/37
    "aiohttp>=3.14.4", # https://github.com/zauberzeug/air-link/security/dependabot/105
]

[project.scripts]
air-link = "air_link.main:main"

[project.urls]
Repository = "https://github.com/zauberzeug/air-link"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    # on Python 3.10 its virtualenv and filelock dependencies cannot both be free of known vulnerabilities
    "pre-commit>=4.6.1; python_full_version >= '3.11'",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[tool.uv]
constraint-dependencies = [
    "filelock>=4.2.1", # https://github.com/zauberzeug/air-link/security/dependabot/110 (also 111 and 112)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["air_link"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = "" # pages are registered by the "main_page" fixture, not by importing main.py
testpaths = ["tests"]

[tool.autopep8]
max-line-length = 120

[tool.codespell]
skip = "*.lock"
check-hidden = true

[tool.ruff]
target-version = "py310"
indent-width = 4
line-length = 120

[tool.ruff.lint]
select = [
    "I",  # isort
    "E",  # pycodestyle
    "W",  # pycodestyle
    "B",  # bugbear
    "F",  # pyflakes
    "UP", # pyupgrade
    "RUF", # ruff
    "PL", # pylint
]
fixable = [
    "I",  # isort
]
ignore = [
    "PLR2004", # magic value comparison
]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["aioping", "docker"]
ignore_missing_imports = true
